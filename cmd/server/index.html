<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parley: dev test page</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { height: 320px; overflow: auto; border: 1px solid #ccc; padding: 8px; margin: 12px 0; }
  .sys { color: #777; }
  input, button { padding: 6px; }
</style>
</head>
<body>
<h1>Parley test page</h1>
<p>User <input id="user" size="12" placeholder="guest"> Room <input id="room" value="general" size="12"> <button id="connect">Connect</button></p>
<div id="log"></div>
<form id="form"><input id="text" size="50" placeholder="Type a message" autocomplete="off" disabled> <button id="send" disabled>Send</button></form>
<script>
const $ = (id) => document.getElementById(id);
let ws;

function log(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text; // textContent, never innerHTML: messages are untrusted
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

$('connect').onclick = () => {
  if (ws) ws.close();
  const user = $('user').value.trim();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws` + (user ? `?user=${encodeURIComponent(user)}` : ''));
  ws.onopen = () => {
    log('connected', 'sys');
    ws.send(JSON.stringify({ type: 'join', room: $('room').value.trim() }));
    $('text').disabled = false;
    $('send').disabled = false;
  };
  ws.onclose = () => {
    log('disconnected', 'sys');
    $('text').disabled = true;
    $('send').disabled = true;
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    switch (m.type) {
      case 'welcome':  log(`you are ${m.from}`, 'sys'); break;
      case 'joined':   log(`joined ${m.room} (online: ${(m.users || []).join(', ')})`, 'sys'); break;
      case 'presence': log(`${m.from} ${m.event} ${m.room}`, 'sys'); break;
      case 'typing':   log(`${m.from} is typing...`, 'sys'); break;
      case 'message':  log(`[${m.room}] ${m.from}: ${m.text}`); break;
      case 'error':    log(`error: ${m.error}`, 'sys'); break;
      default:         log(e.data, 'sys');
    }
  };
};

$('form').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value;
  if (!text || !ws) return;
  ws.send(JSON.stringify({ type: 'message', room: $('room').value.trim(), text }));
  $('text').value = '';
};
</script>
</body>
</html>
